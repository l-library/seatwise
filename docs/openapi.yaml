          $ref: '#/components/schemas/ModelStatus'
    DriftReport:
      type: object
      properties:
        rolling_mae:
          type: array
          items:
            type: object
            additionalProperties: true
            properties: {}
        share_shift:
          type: array
          items:
            type: object
            additionalProperties: true
            properties: {}
        port_health:
          type: array
          items:
            type: object
            additionalProperties: true
            properties: {}
        triggered:
          type: array
          items:
            type: string
    FeatureFlags:
      type: object
      required:
        - prediction
        - waitlist
        - oversell
        - llm
      properties:
        prediction:
          type: boolean
        waitlist:
          type: boolean
        oversell:
          type: boolean
        llm:
          type: boolean
          description: 本轮不实现 L1，开关留在契约里占位，默认 false。
    Flags:
      type: object
      required:
        - policy_version
        - model_version
        - feature_flag
      properties:
        policy_version:
          type: integer
          example: 12
        model_version:
          type: string
          nullable: true
          example: d2-2026w47
        feature_flag:
          $ref: '#/components/schemas/FeatureFlags'
    FlagsPatchRequest:
      type: object
      required:
        - reason
      properties:
        policy_version:
          type: integer
        model_version:
          type: string
        feature_flag:
          $ref: '#/components/schemas/FeatureFlags'
        reason:
          type: string
    Health:
      type: object
      required:
        - status
        - degraded
        - flags
      properties:
        status:
          type: string
          enum:
            - UP
            - DEGRADED
            - DOWN
        degraded:
          type: array
          items:
            type: string
            example: PREDICTION_DISABLED
        flags:
          $ref: '#/components/schemas/Flags'
  responses:
    BadRequest:
      description: 字段缺失、格式错、未知枚举（VALIDATION_FAILED）或缺少二次确认（CONFIRMATION_REQUIRED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    PolicyParamInvalid:
      description: 政策参数越界（POLICY_PARAM_OUT_OF_RANGE），errors[] 给出字段与原因
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ConfirmationRequired:
      description: 高风险变更没带二次确认（CONFIRMATION_REQUIRED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: 无令牌或令牌过期（UNAUTHENTICATED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 角色不够或访问他人资源（FORBIDDEN），并写审计
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 资源不存在（NOT_FOUND）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    BookingConflict:
      description: 当前状态不允许该迁移（BOOKING_STATE_CONFLICT）或座位码无效（SEAT_CODE_INVALID）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    AccountLocked:
      description: 连续登录失败被锁定（ACCOUNT_LOCKED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: 触发限流（RATE_LIMITED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          description: ''
          required: false
          schema:
            type: string
    InternalError:
      description: 未预期错误（INTERNAL）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: 数据库不可用或工件缺失（SERVICE_UNAVAILABLE）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authorization - Bearer <access_token>，有效期 8 小时（API.md 1.2）。
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 0 开始。
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: 每页条数，上限 100。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ZoneIdPath:
      name: zone_id
      in: path
      required: true
      schema:
        type: string
        example: zn_east
    BookingIdPath:
      name: booking_id
      in: path
      required: true
      schema:
        type: string
        example: bkg_7f3a91
    WaitlistEntryIdPath:
      name: entry_id
      in: path
      required: true
      schema:
        type: string
        example: wl_5f2b
    AppealIdPath:
      name: appeal_id
      in: path
      required: true
      schema:
        type: string
        example: ap_9c31
    PolicyVersionPath:
      name: version
      in: path
      required: true
      schema:
        type: integer
        example: 12
    SlotStart:
      name: slot_start
      in: query
      required: true
      description: 时段起点，RFC 3339 带偏移，对齐 30 分钟（API.md 1.3）。
      schema:
        type: string
        format: date-time
        example: '2026-11-23T10:00:00+08:00'
    DurationMinutes:
      name: duration_minutes
      in: query
      required: true
      description: 时长，30 的整数倍。
      schema:
        type: integer
        multipleOf: 30
        example: 120
    FromDateTime:
      name: from
      in: query
      required: true
      description: 区间起点（含），RFC 3339。
      schema:
        type: string
        format: date-time
    ToDateTime:
      name: to
      in: query
      required: true
      description: 区间终点（不含），RFC 3339。
      schema:
        type: string
        format: date-time
    FromDate:
      name: from
      in: query
      required: false
      description: 区间起点（含），日期。
      schema:
        type: string
        format: date
        example: '2026-11-16'
    ToDate:
      name: to
      in: query
      required: false
      description: 区间终点（不含），日期。
      schema:
        type: string
        format: date
        example: '2026-11-23'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 客户端重试去重用的 UUID v7；服务端幂等键是 (业务键, op, version)（API.md 1.6）。
      schema:
        type: string
        format: uuid
  headers:
    Location:
      description: 新建资源的地址。
      schema:
        type: string
        example: /api/v1/bookings/bkg_7f3a91
    IdempotentReplay:
      description: 命中幂等重放时为 true，返回首次的状态码与响应体。
      schema:
        type: boolean
        example: true
    XRowCount:
      description: 导出行数。
      schema:
        type: integer
    XGeneratedAt:
      description: 报表生成时间。
      schema:
        type: string
        format: date-time
    RetryAfter:
      description: 建议的重试间隔（秒）。
      schema:
        type: integer
servers:
  - url: /api/v1
    description: 统一接口前缀（docs/API.md 1.1）
security:
  - bearerAuth: []
