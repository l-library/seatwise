              - PASS
              - FAIL
          properties: {}
    ModelList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModelInfo'
    ModelActivateRequest:
      type: object
      required:
        - reason
