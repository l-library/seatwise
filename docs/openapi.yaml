openapi: 3.0.1
info:
  title: Seatwise API
  description: >
    Seatwise 校园座位供需治理平台 REST 契约 v0.1，设计源为 docs/API.md，条款号指向 docs/SRS.md 与
    docs/DESIGN.md。


    状态约定：

    - 每个接口名称末尾的「（未验证）」表示该契约尚未与实现联调（第一周状态）；
      实现并跑通后删除该标记，同时把 description 首行改成「状态：已验证」。
    - 所有接口统一前缀 /api/v1，错误体为 RFC 9457 problem+json 并附 code 与 trace_id（API.md
    1.5）。

    - 写操作幂等键为 (业务键, op, version)，请求头 Idempotency-Key 只用于客户端重试去重（API.md 1.6）。

    - 关闭模型或端口后接口不报 5xx，改用 available: false 与 insufficient_reason（API.md 1.8）。


    分组即 Apifox 文件夹：tag 名称前缀的数字决定文件夹顺序。
  version: 0.1.0
tags:
  - name: 1 身份认证
  - name: 2 找座与预测
  - name: 3 预约与使用
  - name: 4 候补
  - name: 5 信用与申诉
  - name: 6 通知
  - name: 7 政策
  - name: 8 管理端
  - name: 9 政策模拟
  - name: 10 运维
  - name: 11 系统
paths:
  /auth/login:
    post:
      summary: 登录（未验证）
      deprecated: false
      description: |
        状态：未验证（契约未与实现联调）。
        演示环境用本地账号，IdentityProviderPort 后续替换为 CAS/OAuth（DESIGN 7.4）。
        限流 5 次/分钟/IP，连续失败 5 次锁 15 分钟（SRS 7.2.1）。
      operationId: login
      tags:
        - 1 身份认证
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 字段缺失、格式错、未知枚举（VALIDATION_FAILED）或缺少二次确认（CONFIRMATION_REQUIRED）
        '401':
          $ref: '#/components/responses/Unauthenticated'
          description: 无令牌或令牌过期（UNAUTHENTICATED）
        '423':
          $ref: '#/components/responses/AccountLocked'
          description: 连续登录失败被锁定（ACCOUNT_LOCKED）
        '429':
          $ref: '#/components/responses/RateLimited'
          description: 触发限流（RATE_LIMITED）
      security:
        - bearerAuth: []
  /auth/logout:
    post:
      summary: 登出（未验证）
      deprecated: false
      description: 状态：未验证（契约未与实现联调）。使当前令牌失效。
      operationId: logout
      tags:
        - 1 身份认证
      parameters: []
      responses:
        '204':
          description: 已登出
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthenticated'
          description: 无令牌或令牌过期（UNAUTHENTICATED）
      security:
        - bearerAuth: []
  /auth/me:
    get:
      summary: 当前身份（未验证）
      deprecated: false
      description: 状态：未验证（契约未与实现联调）。返回当前会话的 user 与 role。
      operationId: me
      tags:
        - 1 身份认证
      parameters: []
      responses:
        '200':
          description: 当前身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthenticated'
          description: 无令牌或令牌过期（UNAUTHENTICATED）
      security:
        - bearerAuth: []
  /zones:
    get:
      summary: 区域列表（未验证）
      deprecated: false
      description: 状态：未验证（契约未与实现联调）。返回区域列表与当日开放时段、座位总数、当前可用数。
      operationId: listZones
      tags:
        - 2 找座与预测
      parameters:
        - name: date
          in: query
          description: 日期，默认取服务端当天（Asia/Shanghai）。
          required: false
          example: ''
          schema:
            type: string
            format: date
            example: '2026-11-23T00:00:00.000Z'
      responses:
        '200':
          description: 区域列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneList'
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthenticated'
          description: 无令牌或令牌过期（UNAUTHENTICATED）
      security:
        - bearerAuth: []
  /zones/{zone_id}/seats:
    get:
      summary: 区域座位图（未验证）
      deprecated: false
      description: |
        状态：未验证（契约未与实现联调）。
        只回座位编号与状态，不回他人预约信息（SRS 7.6.4）。
      operationId: listSeats
      tags:
        - 2 找座与预测
      parameters:
        - name: zone_id
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
            example: zn_east
        - name: slot_start
          in: query
          description: 时段起点，RFC 3339 带偏移，对齐 30 分钟（API.md 1.3）。
          required: true
          example: ''
          schema:
            type: string
            format: date-time
            example: '2026-11-23T10:00:00+08:00'
        - name: duration_minutes
          in: query
          description: 时长，30 的整数倍。
          required: true
          example: ''
          schema:
            type: integer
            multipleOf: 30
            example: 120
      responses:
        '200':
          description: 座位图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatMap'
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthenticated'
          description: 无令牌或令牌过期（UNAUTHENTICATED）
        '404':
          $ref: '#/components/responses/NotFound'
          description: 资源不存在（NOT_FOUND）
      security:
        - bearerAuth: []
  /zones/{zone_id}/find-seat-probability:
    get:
      summary: 找座概率（未验证）
      deprecated: false
      description: >
        状态：未验证（契约未与实现联调）。

        D2 输出必须带齐 7.1.4 六项：zone / slot / feature_as_of / model_version / band /
        coverage。

        数据不足或模型不可用时 available=false、probability=null，页面不显示数字（API.md 1.8）。

        proxy_metric=true 表示特征含 WiFi/门禁推断值，界面须标「估算」（R12）。
      operationId: findSeatProbability
      tags:
        - 2 找座与预测
      parameters:
        - name: zone_id
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
            example: zn_east
        - name: slot_start
          in: query
          description: 时段起点，RFC 3339 带偏移，对齐 30 分钟（API.md 1.3）。
          required: true
          example: ''
          schema:
            type: string
            format: date-time
            example: '2026-11-23T10:00:00+08:00'
        - name: duration_minutes
          in: query
          description: 时长，30 的整数倍。
          required: true
          example: ''
          schema:
            type: integer
            multipleOf: 30
            example: 120
      responses:
        '200':
          description: 概率与口径
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prediction'
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthenticated'
          description: 无令牌或令牌过期（UNAUTHENTICATED）
        '404':
          $ref: '#/components/responses/NotFound'
          description: 资源不存在（NOT_FOUND）
        '429':
          $ref: '#/components/responses/RateLimited'
          description: 触发限流（RATE_LIMITED）
      security:
        - bearerAuth: []
  /zones/{zone_id}/alternatives:
    get:
      summary: 错峰与换座候选（未验证）
      deprecated: false
      description: 状态：未验证（契约未与实现联调）。返回 ≤ 3 个候选区域，每个带概率、步行距离与一句依据（UC-09）。
      operationId: listAlternatives
      tags:
        - 2 找座与预测
      parameters:
        - name: zone_id
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
            example: zn_east
        - name: slot_start
          in: query
          description: 时段起点，RFC 3339 带偏移，对齐 30 分钟（API.md 1.3）。
          required: true
          example: ''
          schema:
            type: string
            format: date-time
            example: '2026-11-23T10:00:00+08:00'
        - name: duration_minutes
          in: query
          description: 时长，30 的整数倍。
          required: true
          example: ''
          schema:
            type: integer
            multipleOf: 30
            example: 120
        - name: limit
          in: query
          description: 候选数量，上限 3。
          required: false
          example: ''
          schema:
            type: integer
            default: 3
            maximum: 3
            minimum: 1
      responses:
        '200':
          description: 候选列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlternativeList'
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthenticated'
          description: 无令牌或令牌过期（UNAUTHENTICATED）
        '404':
          $ref: '#/components/responses/NotFound'
          description: 资源不存在（NOT_FOUND）
      security:
        - bearerAuth: []
  /zones/{zone_id}/occupancy-timeline:
    get:
      summary: 占用轨迹（未验证）
      deprecated: false
      description: 状态：未验证（契约未与实现联调）。30 分钟粒度的 D1 占用轨迹，供座位图做热度底色。
      operationId: occupancyTimeline
      tags:
        - 2 找座与预测
      parameters:
        - name: zone_id
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
            example: zn_east
        - name: from
          in: query
          description: 区间起点（含），RFC 3339。
          required: true
          example: ''
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: 区间终点（不含），RFC 3339。
          required: true
          example: ''
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 轨迹序列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccupancyTimeline'
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthenticated'
          description: 无令牌或令牌过期（UNAUTHENTICATED）
        '404':
          $ref: '#/components/responses/NotFound'
          description: 资源不存在（NOT_FOUND）
      security:
        - bearerAuth: []
  /bookings:
    get:
      summary: 我的预约列表（未验证）
      deprecated: false
      description: 状态：未验证（契约未与实现联调）。仅返回本人预约（UC-08）。
      operationId: listBookings
      tags:
        - 3 预约与使用
      parameters:
        - name: page
          in: query
          description: 页码，从 0 开始。
          required: false
          example: ''
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: 每页条数，上限 100。
          required: false
          example: ''
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 分页预约列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPage'
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthenticated'
          description: 无令牌或令牌过期（UNAUTHENTICATED）
      security:
        - bearerAuth: []
    post:
      summary: 创建预约（未验证）
      deprecated: false
      description: >
        状态：未验证（契约未与实现联调）。

        Idempotency-Key 必填；事务内先查幂等键，未命中再靠唯一索引 (seat_id, slot_start) 插入、

        SELECT ... FOR UPDATE 锁单座、状态断言校验信用/配额（DESIGN 4.2、ADR-3）。

        冲突返回 409 SEAT_TAKEN 并附 ≤3 个备选；配额满返回 409 RULE_VIOLATION/QUOTA_FULL 并附
        suggested_slots。
      operationId: createBooking
      tags:
        - 3 预约与使用
      parameters:
        - name: Idempotency-Key
          in: header
          description: 客户端重试去重用的 UUID v7；服务端幂等键是 (业务键, op, version)（API.md 1.6）。
          required: true
          example: ''
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
        required: true
      responses:
        '201':
          description: 预约创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          headers:
            Location:
              required: false
              description: ''
              schema:
                type: string
            Idempotent-Replay:
              required: false
              description: ''
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 字段缺失、格式错、未知枚举（VALIDATION_FAILED）或缺少二次确认（CONFIRMATION_REQUIRED）
        '401':
          $ref: '#/components/responses/Unauthenticated'
          description: 无令牌或令牌过期（UNAUTHENTICATED）
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 角色不够或访问他人资源（FORBIDDEN），并写审计
        '409':
          description: 座位被占（SEAT_TAKEN）、状态冲突或业务规则不满足（RULE_VIOLATION）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers: {}
        '429':
          $ref: '#/components/responses/RateLimited'
          description: 触发限流（RATE_LIMITED）
      security:
        - bearerAuth: []
  /bookings/{booking_id}:
    get:
      summary: 预约详情（未验证）
      deprecated: false
      description: 状态：未验证（契约未与实现联调）。本人或管理员可读（UC-03/08）。
      operationId: getBooking
      tags:
        - 3 预约与使用
      parameters:
        - name: booking_id
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
            example: bkg_7f3a91
      responses:
        '200':
          description: 预约详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthenticated'
          description: 无令牌或令牌过期（UNAUTHENTICATED）
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 角色不够或访问他人资源（FORBIDDEN），并写审计
        '404':
          $ref: '#/components/responses/NotFound'
          description: 资源不存在（NOT_FOUND）
      security:
        - bearerAuth: []
  /bookings/{booking_id}/check-in:
    post:
      summary: 签到（未验证）
      deprecated: false
      description: |
        状态：未验证（契约未与实现联调）。
        PENDING_CHECKIN → IN_USE；服务端校验座位码签名、有效期与座位一致（SRS 7.2.2）。
        幂等键 (booking_id, CHECK_IN, policy_version)。
      operationId: checkIn
      tags:
        - 3 预约与使用
      parameters:
        - name: booking_id
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
            example: bkg_7f3a91
        - name: Idempotency-Key
          in: header
          description: 客户端重试去重用的 UUID v7；服务端幂等键是 (业务键, op, version)（API.md 1.6）。
          required: true
          example: ''
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
        required: true
      responses:
        '200':
          description: 签到后的预约
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          headers:
            Idempotent-Replay:
              required: false
              description: ''
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
          description: 无令牌或令牌过期（UNAUTHENTICATED）
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 角色不够或访问他人资源（FORBIDDEN），并写审计
        '404':
          $ref: '#/components/responses/NotFound'
          description: 资源不存在（NOT_FOUND）
        '409':
          $ref: '#/components/responses/BookingConflict'
          description: 当前状态不允许该迁移（BOOKING_STATE_CONFLICT）或座位码无效（SEAT_CODE_INVALID）
        '429':
          $ref: '#/components/responses/RateLimited'
          description: 触发限流（RATE_LIMITED）
      security:
        - bearerAuth: []
  /bookings/{booking_id}/away:
    post:
      summary: 暂离（未验证）
      deprecated: false
      description: 状态：未验证（契约未与实现联调）。IN_USE → AWAY，超时未返回由 worker 释放（UC-04）。
      operationId: away
      tags:
        - 3 预约与使用
      parameters:
        - name: booking_id
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
            example: bkg_7f3a91
        - name: Idempotency-Key
          in: header
          description: 客户端重试去重用的 UUID v7；服务端幂等键是 (业务键, op, version)（API.md 1.6）。
          required: true
          example: ''
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 暂离后的预约
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthenticated'
          description: 无令牌或令牌过期（UNAUTHENTICATED）
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 角色不够或访问他人资源（FORBIDDEN），并写审计
        '404':
          $ref: '#/components/responses/NotFound'
          description: 资源不存在（NOT_FOUND）
        '409':
          $ref: '#/components/responses/BookingConflict'
          description: 当前状态不允许该迁移（BOOKING_STATE_CONFLICT）或座位码无效（SEAT_CODE_INVALID）
      security:
        - bearerAuth: []
  /bookings/{booking_id}/return:
    post:
      summary: 返回座位（未验证）
      deprecated: false
      description: 状态：未验证（契约未与实现联调）。AWAY → IN_USE（UC-04）。
      operationId: returnToSeat
      tags:
        - 3 预约与使用
      parameters:
        - name: booking_id
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
            example: bkg_7f3a91
        - name: Idempotency-Key
          in: header
          description: 客户端重试去重用的 UUID v7；服务端幂等键是 (业务键, op, version)（API.md 1.6）。
          required: true
          example: ''
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 返回后的预约
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthenticated'
          description: 无令牌或令牌过期（UNAUTHENTICATED）
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 角色不够或访问他人资源（FORBIDDEN），并写审计
        '404':
          $ref: '#/components/responses/NotFound'
          description: 资源不存在（NOT_FOUND）
        '409':
          $ref: '#/components/responses/BookingConflict'
          description: 当前状态不允许该迁移（BOOKING_STATE_CONFLICT）或座位码无效（SEAT_CODE_INVALID）
      security:
        - bearerAuth: []
  /bookings/{booking_id}/release:
    post:
      summary: 提前离座释放（未验证）
      deprecated: false
      description: >
        状态：未验证（契约未与实现联调）。

        IN_USE/AWAY → COMPLETED，settle_reason=CHECK_OUT；幂等键 (booking_id, reason,
        policy_version)。
      operationId: releaseBooking
      tags:
        - 3 预约与使用
      parameters:
        - name: booking_id
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
            example: bkg_7f3a91
        - name: Idempotency-Key
          in: header
          description: 客户端重试去重用的 UUID v7；服务端幂等键是 (业务键, op, version)（API.md 1.6）。
          required: true
          example: ''
          schema:
            type: string
