      description: 状态：未验证（契约未与实现联调）。回滚 ≤ 10 分钟（SRS 7.3.5）。
      operationId: activateModel
      tags:
        - 10 运维
      parameters:
        - name: model_version
          in: path
          description: ''
          required: true
          example: ''
          schema:
            type: string
            example: d2-2026w47
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelActivateRequest'
        required: true
      responses:
        '200':
          description: 生效结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelActivateResponse'
          headers: {}
        '400':
          $ref: '#/components/responses/ConfirmationRequired'
          description: 高风险变更没带二次确认（CONFIRMATION_REQUIRED）
        '401':
          $ref: '#/components/responses/Unauthenticated'
          description: 无令牌或令牌过期（UNAUTHENTICATED）
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 角色不够或访问他人资源（FORBIDDEN），并写审计
        '404':
          $ref: '#/components/responses/NotFound'
          description: 资源不存在（NOT_FOUND）
      security:
        - bearerAuth: []
  /admin/drift:
    get:
      summary: 漂移与端口健康（未验证）
      deprecated: false
      description: 状态：未验证（契约未与实现联调）。滚动 MAE、份额位移与端口健康（SRS 7.3.6）。
      operationId: getDrift
      tags:
        - 10 运维
      parameters: []
      responses:
        '200':
          description: 漂移报告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriftReport'
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthenticated'
          description: 无令牌或令牌过期（UNAUTHENTICATED）
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 角色不够或访问他人资源（FORBIDDEN），并写审计
      security:
        - bearerAuth: []
  /admin/flags:
    get:
      summary: 三元开关（未验证）
      deprecated: false
      description: 状态：未验证（契约未与实现联调）。policy_version、model_version、feature_flag 三个开关。
      operationId: getFlags
      tags:
        - 10 运维
      parameters: []
      responses:
        '200':
          description: 当前开关
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flags'
          headers: {}
        '401':
          $ref: '#/components/responses/Unauthenticated'
          description: 无令牌或令牌过期（UNAUTHENTICATED）
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 角色不够或访问他人资源（FORBIDDEN），并写审计
      security:
        - bearerAuth: []
    patch:
      summary: 修改开关（未验证）
      deprecated: false
      description: |
        状态：未验证（契约未与实现联调）。
        只带要改的键，需要 reason，改完 1 分钟内生效（SRS 7.5.2）；G4 未通过时 oversell 保持 false。
      operationId: updateFlags
      tags:
        - 10 运维
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagsPatchRequest'
        required: true
      responses:
        '200':
          description: 修改后的开关
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flags'
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 字段缺失、格式错、未知枚举（VALIDATION_FAILED）或缺少二次确认（CONFIRMATION_REQUIRED）
        '401':
          $ref: '#/components/responses/Unauthenticated'
          description: 无令牌或令牌过期（UNAUTHENTICATED）
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 角色不够或访问他人资源（FORBIDDEN），并写审计
      security:
        - bearerAuth: []
  /health:
    get:
      summary: 健康检查（未验证）
      deprecated: false
      description: 状态：未验证（契约未与实现联调）。degraded 列出当前降级项与原因，供演练与监控取。
      operationId: health
      tags:
        - 11 系统
      parameters: []
      responses:
        '200':
          description: 健康状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          headers: {}
      security:
        - bearerAuth: []
components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem+json，附加 code 与 trace_id（API.md 1.5）。
      required:
        - type
        - title
        - status
        - code
        - detail
        - trace_id
      properties:
        type:
          type: string
          format: uri
          example: https://seatwise.local/problems/seat-taken
        title:
          type: string
          example: 该座位刚被占用
        status:
          type: integer
          example: 409
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
          example: 座位 st_e2_017 在 2026-11-23T10:00:00+08:00 起 120 分钟内已被预约
        trace_id:
          type: string
          example: 4b1c9f2e8a7d
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
        alternatives:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/Alternative'
        current_state:
          $ref: '#/components/schemas/BookingState'
        appeal_id:
          type: string
        simulation_id:
          type: string
        retry_after_seconds:
          type: integer
          example: 900
        suggested_slots:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/Slot'
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - POLICY_PARAM_OUT_OF_RANGE
        - CONFIRMATION_REQUIRED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - SEAT_TAKEN
        - BOOKING_STATE_CONFLICT
        - RULE_VIOLATION
        - SEAT_CODE_INVALID
        - WAITLIST_FULL
        - APPEAL_ALREADY_OPEN
        - SIMULATION_RUNNING
        - ACCOUNT_LOCKED
        - RATE_LIMITED
        - INTERNAL
        - SERVICE_UNAVAILABLE
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: duration_minutes
        message:
          type: string
          example: 必须是 30 的整数倍
    Violation:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - CREDIT_TOO_LOW
            - DURATION_EXCEEDED
            - DAILY_LIMIT_EXCEEDED
            - QUOTA_FULL
            - SEAT_NOT_AVAILABLE
            - FEATURE_DISABLED
        message:
          type: string
    Role:
      type: string
      enum:
        - STUDENT
        - ADMIN
        - OPERATOR
    User:
      type: object
      required:
        - id
        - display_name
        - credit_score
      properties:
        id:
          type: string
          example: us_1042
        display_name:
          type: string
          example: 李同学
        credit_score:
          type: integer
          example: 92
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: u2023011
        password:
          type: string
          format: password
    AuthSession:
      type: object
      required:
        - access_token
        - expires_at
        - role
        - user
      properties:
        access_token:
          type: string
        expires_at:
          type: string
          format: date-time
          example: '2026-11-23T18:00:00+08:00'
        role:
          $ref: '#/components/schemas/Role'
        user:
          $ref: '#/components/schemas/User'
    MeResponse:
      type: object
      required:
        - user
        - role
      properties:
        user:
          $ref: '#/components/schemas/User'
        role:
          $ref: '#/components/schemas/Role'
    ZoneRef:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          example: zn_east
        name:
          type: string
          example: 东区
    Slot:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: string
          format: date-time
          example: '2026-11-23T10:00:00+08:00'
        end:
          type: string
          format: date-time
          example: '2026-11-23T12:00:00+08:00'
    Zone:
      type: object
      required:
        - id
        - name
        - open_from
        - open_to
        - seat_total
        - seat_available
      properties:
        id:
          type: string
          example: zn_east
        name:
          type: string
          example: 东区
        open_from:
          type: string
          description: 当日开放起点，HH:mm（Asia/Shanghai）。
          example: '08:00'
        open_to:
          type: string
          description: 当日开放终点，HH:mm（Asia/Shanghai）。
          example: '22:00'
        seat_total:
          type: integer
          example: 120
        seat_available:
          type: integer
          example: 37
    ZoneList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Zone'
    SeatStatus:
      type: string
      enum:
        - AVAILABLE
        - BOOKED
        - CLOSED
    Seat:
      type: object
      required:
        - id
        - label
        - status
      properties:
        id:
          type: string
          example: st_e2_017
        label:
          type: string
          example: E2-17
        status:
          $ref: '#/components/schemas/SeatStatus'
    SeatRef:
      type: object
      required:
        - id
        - label
      properties:
        id:
          type: string
          example: st_e2_017
        label:
          type: string
          example: E2-17
    SeatMap:
      type: object
      required:
        - zone
        - slot
        - quota
        - seats
      properties:
        zone:
          $ref: '#/components/schemas/ZoneRef'
        slot:
          $ref: '#/components/schemas/Slot'
        quota:
          type: number
          description: 超额准入放开时大于 1.0；关闭时按 1.0 返回（API.md 1.8）。
          example: 1
        seats:
          type: array
          items:
            $ref: '#/components/schemas/Seat'
    Band:
      type: string
      enum:
        - LOW
        - MEDIUM
        - HIGH
    InsufficientReason:
      type: string
      enum:
        - PREDICTION_DISABLED
        - COVERAGE_INSUFFICIENT
        - MODEL_UNAVAILABLE
        - NOT_READY
    Prediction:
      type: object
      description: D2 输出，六项口径字段缺一不可（SRS 7.1.4 / R2）。
      required:
        - zone
        - slot
        - feature_as_of
        - model_version
        - band
        - coverage
        - available
        - proxy_metric
      properties:
        zone:
          $ref: '#/components/schemas/ZoneRef'
        slot:
          $ref: '#/components/schemas/Slot'
        feature_as_of:
          type: string
          format: date-time
          example: '2026-11-23T09:45:00+08:00'
        model_version:
          type: string
          example: d2-2026w47
        band:
          $ref: '#/components/schemas/Band'
        coverage:
          type: number
          minimum: 0
          maximum: 1
          example: 0.94
        available:
          type: boolean
          example: true
        probability:
          type: number
          minimum: 0
          maximum: 1
          description: available=false 或 G2 未通过时为 null，只给 band。
          nullable: true
          example: 0.71
        proxy_metric:
          type: boolean
          description: true 表示特征含 WiFi/门禁推断值，界面须标「估算」（R12）。
          example: true
        insufficient_reason:
          allOf:
            - $ref: '#/components/schemas/InsufficientReason'
          type: 'null'
    Alternative:
      description: 错峰或换座候选，概率口径字段同 Prediction，另加步行距离与一句依据（C2）。
      allOf:
        - $ref: '#/components/schemas/Prediction'
        - type: object
          required:
            - walking_minutes
            - reason
          properties:
            walking_minutes:
              type: integer
              example: 6
            reason:
              type: string
              example: 北区同一时段历史占用低 12 个百分点
    AlternativeList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/Alternative'
    TimelinePoint:
      type: object
      required:
        - slot_start
        - band
        - probability
        - coverage
      properties:
        slot_start:
          type: string
          format: date-time
        band:
          $ref: '#/components/schemas/Band'
        probability:
          type: number
          nullable: true
        coverage:
          type: number
    OccupancyTimeline:
      type: object
      required:
        - zone
        - feature_as_of
        - model_version
        - coverage
        - available
        - series
      properties:
        zone:
          $ref: '#/components/schemas/ZoneRef'
        feature_as_of:
          type: string
          format: date-time
        model_version:
          type: string
        coverage:
          type: number
        available:
          type: boolean
        insufficient_reason:
          allOf:
            - $ref: '#/components/schemas/InsufficientReason'
          type: 'null'
        series:
          type: array
          items:
            $ref: '#/components/schemas/TimelinePoint'
    BookingState:
      type: string
      description: 六状态（SRS 5.6）。
      enum:
        - PENDING_CHECKIN
        - IN_USE
        - AWAY
        - COMPLETED
        - NO_SHOW
        - CANCELLED
    SettleReason:
      type: string
      description: 六类结算原因（SRS 5.7），账本与幂等键都以它为键。
      enum:
        - CHECK_OUT
        - SESSION_END
        - AWAY_TIMEOUT
        - NO_SHOW
        - FORCED_RELEASE
        - USER_CANCEL
    BookingActions:
      type: object
      description: 由状态机推导，客户端不自己判断能否点击（API.md 3.3）。
      required:
        - can_check_in
        - can_away
        - can_release
        - can_cancel
      properties:
        can_check_in:
          type: boolean
        can_away:
          type: boolean
        can_release:
          type: boolean
        can_cancel:
          type: boolean
    Booking:
      type: object
      required:
        - id
        - zone
        - seat
        - slot
        - state
        - policy_version
        - created_at
        - actions
      properties:
        id:
          type: string
          example: bkg_7f3a91
        zone:
          $ref: '#/components/schemas/ZoneRef'
        seat:
          $ref: '#/components/schemas/SeatRef'
        slot:
          $ref: '#/components/schemas/Slot'
        state:
          $ref: '#/components/schemas/BookingState'
        settle_reason:
          allOf:
            - $ref: '#/components/schemas/SettleReason'
          type: 'null'
        grace_period_minutes:
          type: integer
          example: 15
        check_in_deadline:
          type: string
          format: date-time
          example: '2026-11-23T10:15:00+08:00'
        policy_version:
          type: integer
          example: 12
        credit_delta:
          type: integer
          example: 0
        created_at:
          type: string
          format: date-time
          example: '2026-11-23T09:41:12+08:00'
        actions:
          $ref: '#/components/schemas/BookingActions'
    BookingCreate:
      type: object
      required:
        - seat_id
        - slot_start
        - duration_minutes
      properties:
        seat_id:
          type: string
          example: st_e2_017
        slot_start:
          type: string
          format: date-time
          example: '2026-11-23T10:00:00+08:00'
        duration_minutes:
          type: integer
          multipleOf: 30
          example: 120
    CheckInRequest:
      type: object
      required:
        - seat_code
      properties:
        seat_code:
          type: string
          description: 含签名与有效期的座位码，服务端校验签名、有效期与座位一致（SRS 7.2.2）。
          example: eyJ...sig
    ForceReleaseRequest:
      type: object
      required:
        - reason
        - confirm
      properties:
        reason:
          type: string
          example: 设备维修
        confirm:
          type: boolean
          example: true
    BookingPage:
      type: object
      required:
        - items
        - page
        - size
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        total:
          type: integer
          example: 137
    WaitlistStatus:
      type: string
      enum:
        - WAITING
        - OFFERED
        - CONFIRMED
        - EXPIRED
        - CANCELLED
    WaitlistEntry:
      type: object
      required:
        - id
        - zone
        - slot
        - priority
        - enqueued_at
        - status
      properties:
        id:
          type: string
          example: wl_5f2b
        zone:
          $ref: '#/components/schemas/ZoneRef'
        slot:
          $ref: '#/components/schemas/Slot'
        priority:
          type: integer
          description: 由 credit_priority_tiers 与入队时间共同决定，不接受手工插队。
          example: 2
        enqueued_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/WaitlistStatus'
        expires_at:
          type: string
          format: date-time
          nullable: true
    WaitlistCreate:
      type: object
      required:
        - zone_id
        - slot_start
        - duration_minutes
      properties:
        zone_id:
          type: string
          example: zn_east
        slot_start:
          type: string
          format: date-time
        duration_minutes:
          type: integer
          multipleOf: 30
    WaitlistPage:
      type: object
      required:
        - items
        - page
        - size
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WaitlistEntry'
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
    CreditAccount:
      type: object
      required:
        - score
        - tier
        - window_days
        - updated_at
      properties:
        score:
          type: integer
          example: 92
        tier:
          type: string
          description: 档位由政策的 credit_priority_tiers 推导；示例为普通档。
          example: NORMAL
        window_days:
          type: integer
          example: 180
        next_tier_score:
          type: integer
          nullable: true
          example: 95
        updated_at:
          type: string
          format: date-time
    CreditLedgerEntry:
      type: object
      required:
        - id
        - occurred_at
        - rule_code
        - reason_code
        - delta
        - score_after
        - appealable
      properties:
        id:
          type: string
          example: cle_5531
        occurred_at:
          type: string
          format: date-time
        rule_code:
          type: string
          example: R_NO_SHOW
        reason_code:
          $ref: '#/components/schemas/SettleReason'
        delta:
          type: integer
          example: -5
        score_after:
          type: integer
          example: 87
        booking_id:
          type: string
          nullable: true
        policy_version:
          type: integer
          example: 12
        description:
          type: string
          example: 超过宽限期 15 分钟未签到
        reversal_of:
          type: string
          description: 冲正条目指向被冲正的账本条目；更正只追加，不修改原条目（SRS 7.2.6）。
          nullable: true
        appealable:
          type: boolean
    CreditLedgerPage:
      type: object
      required:
        - items
        - page
        - size
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreditLedgerEntry'
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
    CreditRule:
      type: object
      required:
        - code
        - description
        - delta
      properties:
        code:
          type: string
          example: R_NO_SHOW
        description:
          type: string
          example: 超过宽限期未签到
        delta:
          type: integer
          example: -5
        window_days:
          type: integer
          nullable: true
        appealable:
          type: boolean
    CreditRuleList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreditRule'
    AppealStatus:
      type: string
      enum:
        - OPEN
        - REVERSED
        - REJECTED
    AppealReasonType:
      type: string
      enum:
        - SYSTEM_ERROR
        - EXEMPTION
        - OTHER
    Appeal:
      type: object
      required:
        - id
        - ledger_entry_id
        - status
        - reason_type
        - description
        - created_at
      properties:
        id:
          type: string
          example: ap_9c31
        ledger_entry_id:
          type: string
          example: cle_5531
        status:
          $ref: '#/components/schemas/AppealStatus'
        reason_type:
          $ref: '#/components/schemas/AppealReasonType'
        description:
          type: string
        created_at:
          type: string
          format: date-time
        decision:
          type: string
          enum:
            - REVERSE
            - REJECT
          nullable: true
        reply:
          type: string
          nullable: true
        decided_by:
          type: string
          nullable: true
        decided_at:
          type: string
          format: date-time
          nullable: true
    AppealCreate:
      type: object
      required:
        - ledger_entry_id
        - reason_type
        - description
      properties:
        ledger_entry_id:
          type: string
          example: cle_5531
        reason_type:
          $ref: '#/components/schemas/AppealReasonType'
        description:
          type: string
    AppealDecisionRequest:
      type: object
      required:
        - decision
        - reply
        - confirm
      properties:
        decision:
          type: string
          enum:
            - REVERSE
            - REJECT
        reply:
          type: string
        confirm:
          type: boolean
          example: true
    AppealPage:
      type: object
      required:
        - items
        - page
