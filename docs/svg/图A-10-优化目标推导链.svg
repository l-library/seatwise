="'DengXian'">机会 A：楼层失衡 4.0×</text><text x="104.602" y="238.808" fill="#1F2A40" font-size="11" textLength="170.795" font-family="'DengXian'">（最忙 2,077 vs 最闲 517 人次/日）</text><rect x="106.507" y="271.359" width="166.985" height="42.924" fill="#F4F7FC" style="stroke:#55607A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="116.507" y="290.27" fill="#1F2A40" font-size="11" textLength="114.469" font-family="'DengXian'">机会 B：日内集中 65.4%</text><text x="116.507" y="301.732" fill="#1F2A40" font-size="11" textLength="146.985" font-family="'DengXian'">（午后 34.5% + 傍晚前 30.9%）</text><rect x="103.948" y="334.283" width="172.104" height="42.924" fill="#F4F7FC" style="stroke:#55607A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="113.948" y="353.194" fill="#1F2A40" font-size="11" textLength="86.834" font-family="'DengXian'">机会 C：周内集中</text><text x="113.948" y="364.656" fill="#1F2A40" font-size="11" textLength="152.104" font-family="'DengXian'">（周末需求约为工作日的 47%）</text><rect x="76.908" y="399.207" width="226.184" height="97.848" fill="none" style="stroke:#000;stroke-width:1.5;"/><path d="M175.73,399.207 L175.73,403.669 L165.73,413.669 L76.908,413.669" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="79.908" y="409.118" fill="#000" font-size="11" textLength="88.822" font-family="'DengXian'">约束 3 可迁移比例</text><rect x="86.908" y="430.669" width="206.184" height="54.386" fill="#F4F7FC" style="stroke:#55607A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="96.908" y="449.58" fill="#1F2A40" font-size="11" textLength="186.184" font-family="'DengXian'">只有愿意换区 / 换时段的到达可被引导</text><text x="96.908" y="461.042" fill="#1F2A40" font-size="11" textLength="180.324" font-family="'DengXian'">→ 参数 θ，须由 Part III 自建日志标定</text><text x="96.908" y="472.503" fill="#1F2A40" font-size="11" textLength="114.109" font-family="'DengXian'">（假设区间 0.15-0.35）</text><rect x="82" y="507.055" width="216" height="149.31" fill="none" style="stroke:#000;stroke-width:1.5;"/><path d="M136,507.055 L136,511.517 L126,521.517 L82,521.517" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="85" y="516.965" fill="#000" font-size="11" textLength="44" font-family="'DengXian'">上界推导</text><rect x="105.774" y="538.517" width="168.452" height="42.924" fill="#F4F7FC" style="stroke:#55607A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="115.774" y="557.427" fill="#1F2A40" font-size="11" textLength="123.412" font-family="'DengXian'">引导可获得的座·分钟收益</text><text x="115.774" y="568.889" fill="#1F2A40" font-size="11" textLength="148.452" font-family="'DengXian'">≤ 可开放座·分钟 × 失衡度 × θ</text><rect x="92" y="601.44" width="196" height="42.924" fill="#F4F7FC" style="stroke:#55607A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="102" y="620.351" fill="#1F2A40" font-size="11" textLength="176" font-family="'DengXian'">超标量收益受爽约率与政策上限约束</text><text x="102" y="631.813" fill="#1F2A40" font-size="11" textLength="171.026" font-family="'DengXian'">（超发比例 ≤ 超额收益的硬上限）</text><rect x="103.243" y="666.364" width="173.515" height="97.848" fill="none" style="stroke:#000;stroke-width:1.5;"/><path d="M256.243,666.364 L256.243,670.826 L246.243,680.826 L103.243,680.826" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="106.243" y="676.275" fill="#000" font-size="11" textLength="143" font-family="'DengXian'">目标（中性档，全部待验证）</text><rect x="113.243" y="697.826" width="153.515" height="54.386" fill="#F4F7FC" style="stroke:#55607A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="123.243" y="716.737" fill="#1F2A40" font-size="11" textLength="105.719" font-family="'DengXian'">BG1 有效利用率 ↑ 8%</text><text x="123.243" y="728.199" fill="#1F2A40" font-size="11" textLength="78.515" font-family="'DengXian'">BG2 浪费 ↓ 30%</text><text x="123.243" y="739.661" fill="#1F2A40" font-size="11" textLength="133.515" font-family="'DengXian'">BG4 峰值找座失败率 ↓ 25%</text><rect x="16" y="774.212" width="334" height="150.386" fill="none" style="stroke:#000;stroke-width:1.5;"/><path d="M81,774.212 L81,778.674 L71,788.674 L16,788.674" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="19" y="784.123" fill="#000" font-size="11" textLength="55" font-family="'DengXian'">硬约束闸门</text><polygon points="146,805.674,234,805.674,246,817.674,234,829.674,146,829.674,134,817.674,146,805.674" fill="#FFF6E9" style="stroke:#E08A3C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="146" y="820.854" fill="#1F2A40" font-size="11" textLength="88" font-family="'DengXian'">回测与校准达标？</text><text x="123" y="815.123" fill="#444" font-size="11" font-family="'DengXian'">是</text><text x="246" y="815.123" fill="#444" font-size="11" font-family="'DengXian'">否</text><rect x="28" y="839.674" width="163" height="31.462" fill="#F4F7FC" style="stroke:#55607A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="38" y="858.584" fill="#1F2A40" font-size="11" textLength="143" font-family="'DengXian'">允许放开超额准入与错峰引导</text><rect x="211" y="839.674" width="119" height="42.924" fill="#F4F7FC" style="stroke:#55607A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="221" y="858.584" fill="#1F2A40" font-size="11" textLength="66" font-family="'DengXian'">只能展示建议</text><text x="221" y="870.046" fill="#1F2A40" font-size="11" textLength="99" font-family="'DengXian'">不得更改配额与政策</text><polygon points="190,888.598,202,900.598,190,912.598,178,900.598,190,888.598" fill="#FFF6E9" style="stroke:#E08A3C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="119.5" y="944.598" width="141" height="42.924" fill="#F4F7FC" style="stroke:#55607A;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="129.5" y="963.508" fill="#1F2A40" font-size="11" textLength="121" font-family="'DengXian'">上线后用对照区域做归因</text><text x="129.5" y="974.97" fill="#1F2A40" font-size="11" textLength="111.117" font-family="'DengXian'">（方向一致率 ≥ 80%）</text><path d="M221,997.521 L221,1021.445 L201,1025.445 L221,1029.445 L221,1053.369 A0,0 0 0 0 221,1053.369 L422.533,1053.369 A0,0 0 0 0 422.533,1053.369 L422.533,1007.521 L412.533,997.521 L221,997.521 A0,0 0 0 0 221,997.521